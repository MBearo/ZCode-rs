[package]
name = "zcode-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"
description = "Headless ZCode agent with the App stdio protocol"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
httpdate = "1"
ignore = "0.4"
globset = "0.4"
regex = "1"
rmcp = { version = "3.4", default-features = false, features = [
  "client",
  "transport-async-rw",
  "transport-streamable-http-client-reqwest",
  "reqwest-tls-no-provider",
] }
reqwest_mcp = { package = "reqwest", version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls-native-roots",
] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true
