# nextest 配置：与仓库其他 Rust workspace 相同（docs/specs/rust-u0-foundation.md §2）。
[profile.default]
# 慢测试 30 s 时报告，60 s 时终止；失败重试一次，偶发失败不会直接挡住 CI，但会在报告中标为 flaky。
slow-timeout = { period = "30s", terminate-after = 2 }
retries = 1
fail-fast = false

[profile.default.junit]
path = "junit.xml"

# SSH 的 Docker 测试（docs/specs/rust-cli/remote-exec.md §19.12）：建镜像、上传执行器、断线重连，一次要一分钟左右。
# 三个测试文件都算（ssh_docker、ssh_docker_env、F100 的 ssh_docker_dist：第一次建 debian 镜像要 apt 装包，§26）。
[[profile.default.overrides]]
filter = "binary(/^ssh_docker/)"
slow-timeout = { period = "60s", terminate-after = 5 }
retries = 0
