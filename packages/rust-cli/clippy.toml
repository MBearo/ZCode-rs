  { path = "tokio::net::TcpListener::bind", reason = "network listeners go through rust-cli-net (§4)", allow-invalid = true },
  { path = "tokio::net::UdpSocket::bind", reason = "network egress goes through rust-cli-net (§4)", allow-invalid = true },
