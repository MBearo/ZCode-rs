  { path = "tokio::net::UnixListener::bind", reason = "sockets go through rust-cli-net (§4)", allow-invalid = true },
  { path = "tokio::net::UnixDatagram::bind", reason = "sockets go through rust-cli-net (§4)", allow-invalid = true },
  { path = "tokio::net::UnixDatagram::unbound", reason = "sockets go through rust-cli-net (§4)", allow-invalid = true },
  { path = "tokio::net::windows::named_pipe::ClientOptions::open", reason = "named pipes go through rust-cli-net (§4)", allow-invalid = true },
  { path = "tokio::net::windows::named_pipe::ServerOptions::create", reason = "named pipes go through rust-cli-net (§4)", allow-invalid = true },
  { path = "tokio::net::lookup_host", reason = "name resolution is network IO; go through rust-cli-net (§4)", allow-invalid = true },
  # 时间：业务时间只经注入的 Clock（本机实现 node-store 的 SystemClock）。
  { path = "std::time::SystemTime::now", reason = "take the time from the injected Clock (§4, §6 rule 12)" },
  # F55 补：`SystemTime::elapsed` 内部读当前时间（`UNIX_EPOCH.elapsed()` 就是 now）。
  { path = "std::time::SystemTime::elapsed", reason = "reads the current time; take the time from the injected Clock (§4, §6 rule 12)" },
  # ID：随机 ID 只经注入的 Ids（本机实现 node-store 的 NodeIds）。
  { path = "uuid::Uuid::new_v4", reason = "take IDs from the injected Ids (§4)" },
  # 随机（F58）：随机种子只经 base 的 random；加密强度的随机只在 platform（ring）。`hash_map::RandomState` 是同一个类型。
  { path = "std::hash::RandomState::new", reason = "take random values from rust_cli_base::random (§4)" },
  { path = "ring::rand::SystemRandom::new", reason = "cryptographic randomness stays in rust-cli-platform (§4)" },
]
