[package]
name = "rust-cli-agents"
description = "Subagents, background agents, task notifications and task lists of rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# 读对照数据的测试只在完整的源码仓库编译（docs/specs/rust-cli/export.md §5）；不传给依赖。
parity = []

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-prompts.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
