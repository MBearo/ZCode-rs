[package]
name = "rust-cli-compact"
description = "Context compaction of rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-prompts.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true
# 阻塞线错误文字里的失败原因按显示宽度截断（compact.md §2.2）。
unicode-width.workspace = true

[dev-dependencies]
# 测试的模型常量（base 的 `models`，工作线 F121）。
rust-cli-base.workspace = true
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
