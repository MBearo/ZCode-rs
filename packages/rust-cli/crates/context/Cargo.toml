[package]
name = "rust-cli-context"
description = "System prompt sections, instruction files and attachments of rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
# 产品目录与文件的名字（`.zcode`、`AGENTS.md`，README §4.1，F55）。
rust-cli-base.workspace = true
# 规则文件的 frontmatter、@include 与条件规则的 glob（context.md §11）。
regex.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-memory.workspace = true
rust-cli-prompts.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
