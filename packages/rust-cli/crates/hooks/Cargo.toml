[package]
name = "rust-cli-hooks"
description = "Hook events and executors of rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
# matcher 是 JS RegExp 语法（`new RegExp(matcher)`），与 platform 一样用 ECMAScript 语义。
regress.workspace = true
# 信任 digest 的 JSON 文本按 JS 规则生成（config.md §4.1）。
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-prompts.workspace = true
serde_json.workspace = true
# 项目 hooks 信任的 digest（Node 用 sha256，config.md §4.1）。
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
