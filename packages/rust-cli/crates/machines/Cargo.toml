[package]
name = "rust-cli-machines"
description = "Remote machines of rust-cli: the machine list (machines.json) and the connection state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
# 订阅连接状态的任务经 base 的 TaskScope 启动（README §3.1）。
rust-cli-base.workspace = true
rust-cli-exec-client.workspace = true
# 只认 Connector / Provisioner（remote-exec.md §15.3、§19.10）：具体的 SSH 实现由组装根注入。
rust-cli-exec-transport.workspace = true
# 机器清单 machines.json（R3，remote-exec.md §20.3.1）：文件经 fs，位置由 paths 给。
rust-cli-fs.workspace = true
rust-cli-paths.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
# 测试里的假执行器：收 hello、回 welcome（帧的编解码）。
rust-cli-exec-wire.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
