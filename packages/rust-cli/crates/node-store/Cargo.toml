[package]
name = "rust-cli-node-store"
description = "Session store and artifacts on the Node CLI db.sqlite for rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
rust-cli-base.workspace = true
rust-cli-fs.workspace = true
rust-cli-kernel-api.workspace = true
# Node 记录格式的纯函数（F128，审查 X5）：仓储与事务在这里，记录的形状与读回在 node-records。
rust-cli-node-records.workspace = true
rust-cli-paths.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# 共用的测试时钟（kernel-api 的 testing，F126）。
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio.workspace = true
