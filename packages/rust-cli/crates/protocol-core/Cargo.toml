[package]
name = "rust-cli-protocol-core"
description = "Protocol framework of rust-cli: framing, request correlation, outbound requests, session bridge and delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
# 入站 schema 的 pattern（JSON Schema 子集的校验器，schema.rs）。
regex.workspace = true
# 任务经 base 的 TaskScope（README §4）。
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
