[package]
name = "rust-cli-session"
description = "Session actor: the owner of a session's state in rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
# 会话标题的提示词（docs/specs/rust-cli/titles.md §1）。
rust-cli-prompts.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
# 会话 actor 的测试跑真实的主循环（工作线 F131 起产品代码不依赖 query：通知的文字在 prompts）。
rust-cli-query.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
