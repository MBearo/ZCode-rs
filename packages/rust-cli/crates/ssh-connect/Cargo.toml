[package]
name = "rust-cli-ssh-connect"
description = "SSH connector and provisioner for the remote executor: probe, upload with sha256, stdio link over ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
# 远端目录与可执行文件的名字（docs/specs/rust-cli/remote-exec.md §19.4）；任务经 base 的 owned。
rust-cli-base.workspace = true
# 上传前读本机的 Linux 产物（ELF 头、sha256、内容）：本机文件经 fs（README §4）。
rust-cli-fs.workspace = true
rust-cli-exec-transport.workspace = true
# ssh 进程只经 proc 起（README §4）。
rust-cli-proc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
