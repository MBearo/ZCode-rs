[package]
name = "rust-cli-tools"
description = "Tool registry, execution pipeline and built-in tools of rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
regex.workspace = true
rust-cli-base.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-policy.workspace = true
rust-cli-prompts.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
# CronList 按显示宽度截断 prompt。
unicode-width.workspace = true
# WebFetch 的 URL 校验、重定向地址解析（WHATWG URL 规则）。
url.workspace = true

[dev-dependencies]
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tokio-util.workspace = true
