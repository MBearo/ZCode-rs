[package]
name = "rust-cli-tui-kit"
description = "Rendering kit shared by the terminal interfaces of rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# 测试用的终端解码器、假终端与宽度锁，两套界面的测试都用（docs/specs/rust-cli/tui-kit.md）。
testing = []

[dependencies]
anyhow.workspace = true
# OSC 52、kitty / iTerm2 图形的字节（tui-kit.md §2.2）。
base64.workspace = true
crossterm.workspace = true
futures-util.workspace = true
rust-cli-base.workspace = true
# theme.json（tui-kit.md §2.2）。
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
# 现场速度的字数里哪些是宽字（`widgets::live_speed::written`，同 Puffin fold 的 `count_live`）。
unicode-width.workspace = true

# OSC 10/11 探测的带超时读（tui-kit.md §2.2）。
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
